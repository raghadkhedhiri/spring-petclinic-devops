---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: petclinic
  namespace: petclinic
  labels:
    app: petclinic
    monitoring: enabled
spec:
  groups:
    - name: petclinic.rules
      rules:
        - alert: PetClinicTargetDown
          expr: (up{namespace="petclinic", service="petclinic-metrics"} == 0) or absent(up{namespace="petclinic", service="petclinic-metrics"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PetClinic metrics target is down"
            description: "Prometheus cannot scrape the PetClinic metrics endpoint for more than 2 minutes."

        - alert: PetClinicDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="petclinic", deployment="petclinic"} < kube_deployment_spec_replicas{namespace="petclinic", deployment="petclinic"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PetClinic deployment has unavailable replicas"
            description: "The PetClinic deployment has fewer available replicas than expected."

        - alert: PetClinicContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="petclinic", container="petclinic"}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "PetClinic container restarted"
            description: "A PetClinic container restarted during the last 10 minutes."
