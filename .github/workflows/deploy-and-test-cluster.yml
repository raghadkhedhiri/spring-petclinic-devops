name: Validate PetClinic Kubernetes Manifests

on:
  push:
    branches: [main]
    paths:
      - 'k8s/base/**'
      - '.github/workflows/deploy-and-test-cluster.yml'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/base/**'
      - '.github/workflows/deploy-and-test-cluster.yml'

jobs:
  validate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Create PetClinic namespace
        run: kubectl apply -f k8s/base/namespace.yaml

      - name: Validate application manifests
        run: |
          kubectl apply --dry-run=server \
            -f k8s/base/petclinic-configmap.yaml \
            -f k8s/base/petclinic-deployment.yaml \
            -f k8s/base/petclinic-service.yaml \
            -f k8s/base/petclinic-metrics-service.yaml \
            -f k8s/base/petclinic-ingress.yaml
