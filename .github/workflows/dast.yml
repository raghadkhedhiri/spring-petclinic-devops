name: PetClinic DAST

on:
  workflow_run:
    workflows: ["PetClinic CD"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify deployed application is reachable
        env:
          TARGET_URL: ${{ vars.PETCLINIC_BASE_URL }}
        run: |
          set -euo pipefail

          test -n "${TARGET_URL}"

          curl -fsS \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            "${TARGET_URL}" >/dev/null

          echo "PETCLINIC_DAST_TARGET_OK"

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ vars.PETCLINIC_BASE_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
