---
- name: Wait for K3s API server to become ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_api_ready
  changed_when: false
  retries: 30
  delay: 5
  until:
    - k3s_api_ready.rc == 0
    - "'ok' in k3s_api_ready.stdout"

- name: Wait for Kubernetes node to become Ready
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl wait
    --for=condition=Ready
    node
    --all
    --timeout=120s
  changed_when: false

- name: Get Kubernetes node status
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_nodes
  changed_when: false

- name: Display Kubernetes node status
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines
