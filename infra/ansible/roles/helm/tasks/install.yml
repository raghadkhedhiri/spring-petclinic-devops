---
- name: Check currently installed Helm version
  ansible.builtin.command: "{{ helm_install_dir }}/helm version"
  register: helm_installed_version
  changed_when: false
  failed_when: false

- name: Install Helm prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout

- name: Ensure Helm download directory exists
  ansible.builtin.file:
    path: "{{ helm_download_dir }}/helm-{{ helm_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout

- name: Download official Helm archive with checksum verification
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "{{ helm_download_dir }}/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    checksum: "sha256:{{ helm_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "{{ helm_download_dir }}/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "{{ helm_download_dir }}/helm-{{ helm_version }}"
    remote_src: true
    creates: "{{ helm_download_dir }}/helm-{{ helm_version }}/linux-{{ helm_arch }}/helm"
  when:
    - helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout

- name: Install Helm binary
  ansible.builtin.copy:
    src: "{{ helm_download_dir }}/helm-{{ helm_version }}/linux-{{ helm_arch }}/helm"
    dest: "{{ helm_install_dir }}/helm"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - helm_installed_version.rc != 0 or helm_version not in helm_installed_version.stdout
