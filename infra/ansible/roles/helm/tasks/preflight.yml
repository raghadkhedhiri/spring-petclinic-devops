---
- name: Verify supported operating system for Helm
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["architecture"] == "x86_64"
    fail_msg: "Helm installation requires Ubuntu Linux on x86_64."
    success_msg: "Operating system and architecture are supported for Helm."

- name: Validate pinned Helm release metadata
  ansible.builtin.assert:
    that:
      - helm_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - helm_arch == "amd64"
      - helm_checksum is match('^[0-9a-f]{64}$')
    fail_msg: "Helm version, architecture, or checksum is invalid."
    success_msg: "Pinned Helm release metadata is valid."

- name: Check K3s binary
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: helm_k3s_binary

- name: Verify K3s is installed
  ansible.builtin.assert:
    that:
      - helm_k3s_binary.stat.exists
      - helm_k3s_binary.stat.executable
    fail_msg: "K3s must be installed before Helm."
    success_msg: "K3s binary is available."

- name: Verify K3s API is reachable
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: helm_k3s_api
  changed_when: false
  retries: 12
  delay: 5
  until:
    - helm_k3s_api.rc == 0
    - "'ok' in helm_k3s_api.stdout"
