---
- name: Check monitoring namespace
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - namespace
      - "{{ monitoring_namespace }}"
  register: monitoring_namespace_check
  changed_when: false
  failed_when: false

- name: Create monitoring namespace when missing
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - create
      - namespace
      - "{{ monitoring_namespace }}"
  when: monitoring_namespace_check.rc != 0

- name: Check Grafana admin secret
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ monitoring_namespace }}"
      - get
      - secret
      - "{{ monitoring_grafana_admin_secret }}"
  register: monitoring_grafana_secret_check
  changed_when: false
  failed_when: false

- name: Require Grafana password when secret does not exist
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length > 0
    fail_msg: "Set GRAFANA_ADMIN_PASSWORD before running Ansible on a cluster where the Grafana admin secret does not exist."
  when: monitoring_grafana_secret_check.rc != 0

- name: Create Grafana admin secret when missing
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ monitoring_namespace }}"
      - create
      - secret
      - generic
      - "{{ monitoring_grafana_admin_secret }}"
      - "--from-literal=admin-user={{ monitoring_grafana_admin_user }}"
      - "--from-literal=admin-password={{ monitoring_grafana_admin_password }}"
  when: monitoring_grafana_secret_check.rc != 0
  no_log: true
