---
- name: Copy Alertmanager email configuration to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../k8s/monitoring/petclinic-alertmanagerconfig.yaml"
    dest: /tmp/petclinic-alertmanagerconfig.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply PetClinic AlertmanagerConfig
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - petclinic
      - apply
      - -f
      - /tmp/petclinic-alertmanagerconfig.yaml
  register: email_config_apply
  changed_when: "'created' in email_config_apply.stdout or 'configured' in email_config_apply.stdout"
