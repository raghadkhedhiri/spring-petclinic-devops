---
- name: Require Gmail alert address
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'PETCLINIC_ALERT_EMAIL') | length > 0
    fail_msg: "Set PETCLINIC_ALERT_EMAIL before enabling Gmail alerts."
  no_log: true

- name: Generate Alertmanager email configuration on server
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../k8s/monitoring/petclinic-alertmanagerconfig.yaml.tpl') | replace('REPLACE_WITH_GMAIL_ADDRESS', lookup('ansible.builtin.env', 'PETCLINIC_ALERT_EMAIL')) }}"
    dest: /tmp/petclinic-alertmanagerconfig.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply PetClinic AlertmanagerConfig
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - petclinic
      - apply
      - -f
      - /tmp/petclinic-alertmanagerconfig.yaml
  register: email_config_apply
  changed_when: "'created' in email_config_apply.stdout or 'configured' in email_config_apply.stdout"
