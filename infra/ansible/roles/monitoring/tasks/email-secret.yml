---
- name: Check Gmail SMTP Secret
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - petclinic
      - get
      - secret
      - petclinic-gmail-smtp
  register: gmail_secret_check
  changed_when: false
  failed_when: false

- name: Require Gmail password when Secret is missing
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'PETCLINIC_GMAIL_APP_PASSWORD') | length > 0
    fail_msg: "PETCLINIC_GMAIL_APP_PASSWORD must be configured."
  when: gmail_secret_check.rc != 0
  no_log: true

- name: Create Gmail SMTP Secret securely
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - petclinic
      - create
      - secret
      - generic
      - petclinic-gmail-smtp
      - --from-file=password=/dev/stdin
    stdin: "{{ lookup('ansible.builtin.env', 'PETCLINIC_GMAIL_APP_PASSWORD') }}"
    stdin_add_newline: false
  when: gmail_secret_check.rc != 0
  no_log: true
